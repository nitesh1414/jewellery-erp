[package]
name = "jewellery-erp-desktop"
version = "1.0.0"
description = "Jewellery Shop ERP & POS - Desktop Edition"
authors = ["Shri Jewellers"]
edition = "2021"
rust-version = "1.70"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/[manifest.html]

[lib]
name = "jewellery_erp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
printing = "0.2"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.11"
sha2 = "0.10"
hex = "0.4"

[features]
# This feature is used for production builds where `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort" # Abort on panic in release mode
codegen-units = 1 # Maximize compile time optimizations
lto = true # Enable Link-Time-Optimization
opt-level = "s" # Optimize for size
strip = true # Strip symbols (smaller binary)

[profile.dev]
incremental = true
