# Jewellery ERP — License Server (API + admin portal) behind Nginx.
#
#   sed 's/licenses.example.com/YOUR.DOMAIN/' deploy/license-server/nginx-license-server.conf \
#     | sudo tee /etc/nginx/sites-available/jewellery-license-server
#   sudo ln -s /etc/nginx/sites-available/jewellery-license-server /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR.DOMAIN        # adds HTTPS + HTTP→HTTPS redirect
#
# Enable this site (the symlink above) BEFORE running certbot, and verify its
# output says "deployed certificate … to /etc/nginx/sites-enabled/jewellery-license-server".
# If it deploys to "default" instead, HTTPS will serve Ubuntu's static site
# and /api/* will 404 — see docs/DEPLOY-LICENSE-SERVER-VPS.md, Step 10.
#
# The license server itself serves BOTH the /api endpoints and the built
# admin portal on port 4010, so a single proxy_pass covers everything.
# Keep HOST=127.0.0.1 in packages/license-server/.env so 4010 stays private.

server {
    listen 80;
    listen [::]:80;
    server_name licenses.example.com;

    # License payloads are tiny; the API itself rejects bodies over 256 KB.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
